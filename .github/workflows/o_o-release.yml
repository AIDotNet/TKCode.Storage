# Builds O_O installers for macOS, Windows and Linux and, for tags "o_o-v1.2.3", attaches them to a GitHub Release.
# Start it by hand (Actions → O_O release → Run workflow) to get the installers as build artifacts only.
#
#   macOS    arm64 + x64   .dmg, signed with the Developer ID; notarized when the Apple ID secrets are set
#   Windows  x64 + arm64   Inno Setup installer (.exe, per-user) and a portable .zip — unsigned for now
#   Linux    x64 + arm64   .deb and .tar.gz (X11 / XWayland)
#
# macOS secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE              base64 of the Developer ID Application certificate (.p12, with private key)
#   MACOS_CERTIFICATE_PASSWORD     the .p12 password
#   APPLE_ID                       optional: the Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD    optional: an app-specific password for that Apple ID (appleid.apple.com)
# Variable: APPLE_TEAM_ID (42B564FHYL).
# Without the two optional secrets the .dmg is signed but not notarized: it runs, but macOS asks the user to allow it
# once (System Settings → Privacy & Security → Open Anyway) when it was downloaded with a browser.
name: O_O release

on:
  push:
    tags: ["o_o-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/o_o-v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/o_o-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: O_O
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: O_O/global.json

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then echo "No Developer ID Application identity in the certificate" >&2; exit 1; fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          NOTARIZE=()
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            NOTARIZE=(--notarize)
          else
            echo "::warning::APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD not set: the .dmg is signed but not notarized."
          fi
          build/macos/package.sh --arch "${{ matrix.arch }}" --version "${{ needs.version.outputs.value }}" \
            --identity "$SIGNING_IDENTITY" "${NOTARIZE[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: O_O-macos-${{ matrix.arch }}
          path: O_O/build/out/*.dmg
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: O_O
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: O_O/global.json

      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build and package
        run: build/windows/package.ps1 -Arch ${{ matrix.arch }} -Version "${{ needs.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: O_O-windows-${{ matrix.arch }}
          path: |
            O_O/build/out/*.exe
            O_O/build/out/*.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: O_O
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: O_O/global.json

      - name: NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build and package
        run: build/linux/package.sh --arch ${{ matrix.arch }} --version "${{ needs.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: O_O-linux-${{ matrix.arch }}
          path: |
            O_O/build/out/*.deb
            O_O/build/out/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/o_o-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release notes: this version's section of O_O/CHANGELOG.md ("## <version> ..." up to the next "## "),
      # followed by where to find each installer.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/o_o-v}"
          awk -v v="$VERSION" '/^## /{ on = ($2 == v); next } on' O_O/CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then echo "::warning::O_O/CHANGELOG.md has no section for $VERSION"; fi
          printf '\n### 下载\n%s\n' "macOS 14+: O_O-$VERSION-macos-arm64.dmg (Apple Silicon) or -x64.dmg (Intel), drag O_O to Applications. Windows: O_O-$VERSION-windows-x64-setup.exe (or arm64; a portable .zip is also attached). Linux: o-o_${VERSION}_amd64.deb / _arm64.deb, or the .tar.gz." >> notes.md
          gh release create "${GITHUB_REF#refs/tags/}" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "O_O $VERSION" --notes-file notes.md

  # Tells the O_O service (the website, the update check) about the new version; the installers stay on the GitHub release.
  # Needs the secret O_O_SERVICE_TOKEN (the service's O_O_SERVICE_TOKEN); the address is the repository variable
  # O_O_SERVICE_URL, https://island.astra-gate.si when unset.
  service:
    name: Publish to the O_O service
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/o_o-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: O_O/global.json

      - name: Publish the release
        env:
          O_O_SERVICE_TOKEN: ${{ secrets.O_O_SERVICE_TOKEN }}
          BASE: ${{ vars.O_O_SERVICE_URL || 'https://island.astra-gate.si' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/o_o-v}"
          GH="https://github.com/${GITHUB_REPOSITORY}/releases/download/o_o-v$VERSION"
          NOTES="$(awk -v v="$VERSION" '/^## /{ on = ($2 == v); next } on' O_O/CHANGELOG.md)"
          jq -n --arg v "$VERSION" --arg gh "$GH" --arg notes "${NOTES:-O_O $VERSION}" '{
            version: $v, notes: $notes,
            downloads: {
              "macos-arm64":   "\($gh)/O_O-\($v)-macos-arm64.dmg",
              "macos-x64":     "\($gh)/O_O-\($v)-macos-x64.dmg",
              "windows-x64":   "\($gh)/O_O-\($v)-windows-x64-setup.exe",
              "windows-arm64": "\($gh)/O_O-\($v)-windows-arm64-setup.exe",
              "linux-x64":     "\($gh)/o-o_\($v)_amd64.deb",
              "linux-arm64":   "\($gh)/o-o_\($v)_arm64.deb" } }' > release.json
          curl -fsS -X POST "$BASE/api/releases" -H "Authorization: Bearer $O_O_SERVICE_TOKEN" \
            -H "Content-Type: application/json" --data-binary @release.json

      # The plugin catalog (O_O/catalog/plugins): every plugin that is not built in, packed exactly as installing checks it
      # and uploaded; the service keeps the newest version of each. After the release, so a failure here never holds back
      # the new version.
      - name: Publish the plugin catalog
        env:
          O_O_SERVICE_TOKEN: ${{ secrets.O_O_SERVICE_TOKEN }}
          BASE: ${{ vars.O_O_SERVICE_URL || 'https://island.astra-gate.si' }}
        run: |
          bash O_O/catalog/pack.sh "$RUNNER_TEMP/catalog"
          for zip in "$RUNNER_TEMP"/catalog/*.zip; do
            curl -fsS -X POST "$BASE/api/plugins" -H "Authorization: Bearer $O_O_SERVICE_TOKEN" \
              -H "Content-Type: application/zip" --data-binary @"$zip" > /dev/null
            echo "uploaded $(basename "$zip")"
          done
